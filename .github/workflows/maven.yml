name: Java CI with Maven, Docker, SonarCloud and Coveralls

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.sonar/cache
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set Maven additional goals
        run: echo "SONARGOAL=sonar:sonar" >> $GITHUB_ENV
        if: ${{ env.SONAR_TOKEN }}

      - name: Set Maven additional profiles
        run: echo "COVERALLSFLAG=-Pcoveralls" >> $GITHUB_ENV
        if: ${{ env.COVERALLS_REPO_TOKEN }}

      - name: Build with Maven, SonarCloud and Coveralls
        run: xvfb-run mvn verify $SONARGOAL $COVERALLSFLAG